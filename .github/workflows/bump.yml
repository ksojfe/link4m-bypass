name: link4m-bypass
on:
  push:
    paths: ["link4m.js"]
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Get bot user id
        id: bot
        run: echo "id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Update hash + version
        run: |
          H=$(git rev-parse HEAD)
          V=$(date +%s)
          sed -i -E "s|(@require[[:space:]]+https://cdn\.jsdelivr\.net/gh/[^@]+@)[0-9a-f]{7,40}(/link4m\.js)|\1$H\2|" link4m.user.js
          sed -i -E "s|(@version[[:space:]]+).*|\1$V|" link4m.user.js

      - name: Commit
        run: |
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.bot.outputs.id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git add link4m.user.js
          git commit -m "bump version + hash" || exit 0
          git push

      - name: Purge jsDelivr
        run: |
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/link4m.user.js"
